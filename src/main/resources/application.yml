spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/work?serverTimezone=Asia/Seoul&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  security:
    user:
      name: user
      password: 1234

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

  redis:
    host: 127.0.0.1
    port: 6379

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  elasticsearch:
    uris: http://localhost:9200
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

  http:
    client:
      connect-timeout: 3s
      read-timeout: 5s

jwt:
  secret: ${JWT_KEY}

aes:
  key: ${AES_KEY}

Authorization:
  work-point:
    x-api-key-header: X-API-KEY
    x-api-key-value: dasdlkdjfkdlsjailskdjfkdl

external:
  work-point:
    host-url: http://localhost:8082
    endpoint:
      get-user-point: /api/v1/point/user/{userId}
      create-user-point: /api/v1/point/user

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true